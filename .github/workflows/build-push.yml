name: Build & Push Hub Image

on:
  push:
    branches: [main, lrb]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # solutions-hpe/webui-hub

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch cs-webui frontend (same branch, fallback to main)
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="https://github.com/solutions-hpe/cs-webui.git"
          # Clone cs-webui at matching branch; fall back to main if branch doesn't exist
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 -b "$BRANCH" "$REPO" /tmp/cs-webui
            echo "Fetched cs-webui branch: $BRANCH"
          else
            git clone --depth=1 -b main "$REPO" /tmp/cs-webui
            echo "Branch $BRANCH not found in cs-webui — using main"
          fi
          # Copy frontend files into the hub build context (main.py expects frontend/static + frontend/templates)
          mkdir -p frontend/static frontend/templates
          cp -r /tmp/cs-webui/static/. frontend/static/
          cp /tmp/cs-webui/templates/index.html frontend/templates/index.html

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}

      - name: Print image URL
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "unknown")
          echo "✅ Pushed version ${VERSION}:"
          echo "   ghcr.io/${{ github.repository }}:latest"

  cleanup-old-runs:
    name: Delete old workflow runs
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete old runs (keep last 5)
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo:  context.repo.repo,
                workflow_id: 'build-push.yml',
                per_page: 100,
              }
            );
            const completed = runs.filter(r => r.status === 'completed');
            const toDelete  = completed.slice(5);   // keep 5 most recent
            for (const run of toDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                run_id: run.id,
              });
              console.log(`Deleted run #${run.run_number} (${run.id})`);
            }
            console.log(`Kept ${Math.min(completed.length, 5)}, deleted ${toDelete.length}`);

