name: Build & Push Hub Image

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # solutions-hpe/webui-hub

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch cs-webui frontend (same branch, fallback to main)
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="https://github.com/solutions-hpe/cs-webui.git"
          # Clone cs-webui at matching branch; fall back to main if branch doesn't exist
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 -b "$BRANCH" "$REPO" /tmp/cs-webui
            echo "Fetched cs-webui branch: $BRANCH"
          else
            git clone --depth=1 -b main "$REPO" /tmp/cs-webui
            echo "Branch $BRANCH not found in cs-webui — using main"
          fi
          # Copy frontend files into the hub build context (main.py expects frontend/static + frontend/templates)
          mkdir -p frontend/static frontend/templates
          cp -r /tmp/cs-webui/static/. frontend/static/
          cp /tmp/cs-webui/templates/index.html frontend/templates/index.html

      - name: Fetch client-sim installer version
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="https://github.com/solutions-hpe/client-sim.git"
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 -b "$BRANCH" "$REPO" /tmp/client-sim
          else
            git clone --depth=1 -b main "$REPO" /tmp/client-sim
          fi
          VER=$(cat /tmp/client-sim/webui-spoke/INSTALLER_VERSION 2>/dev/null || echo "1.00")
          echo "$VER" > CLIENT_SIM_VERSION
          echo "client-sim installer version: $VER"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          SHA_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --build-arg BUILD_REF="${{ github.ref_name }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"

      - name: Also push to Azure Container Registry
        run: |
          # Import the just-built ghcr.io image into ACR so local redeploy
          # script can pull from ACR without needing to build locally.
          az login --service-principal \
            -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --output none 2>/dev/null || true
          # If Azure credentials are available, import to ACR
          if az account show &>/dev/null; then
            az acr import \
              --name cshubregistry \
              --source "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
              --image "hub:main" \
              --username "${{ github.actor }}" \
              --password "${{ secrets.GITHUB_TOKEN }}" \
              --force \
              --output none && echo "  ✓ Imported to ACR" || echo "  ⚠ ACR import skipped (no Azure credentials)"
          else
            echo "  ⚠ Azure credentials not configured — ACR import skipped"
          fi

      - name: Print image URL
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "unknown")
          echo "✅ Pushed version ${VERSION}:"
          echo "   ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
