services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: csw
      POSTGRES_USER: csw
      POSTGRES_PASSWORD: csw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://csw:csw@db:5432/csw
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db
    volumes:
      - ./static:/app/static

volumes:
  pgdata:
